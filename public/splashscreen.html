<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <style>
    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      font-family: system-ui, sans-serif;
      background-color: transparent;
    }
    .splash-container {
      width: 1280px;
      height: 720px;
      background: linear-gradient(135deg, #1e1e24 0%, #121214 100%);
      color: #ffffff;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      box-sizing: border-box;
      padding: 30px;
    }
    .art-bg {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: url('/videns_splash_art.png') center/cover no-repeat;
    }
    .info-box {
      position: relative;
      z-index: 10;
    }
    h1 { margin: 0; font-size: 20px; font-weight: 600; color: #f0f0f0; }
    p { margin: 5px 0 0 0; font-size: 12px; color: #888; }
    .loader {
      margin-top: 15px;
      height: 3px;
      width: 100%;
      background-color: #222;
      overflow: hidden;
    }
    .loader-bar {
      height: 100%;
      width: 40%;
      background-color: #007bff;
      animation: loading 1.5s infinite ease-in-out;
    }
    @keyframes loading {
      0% { transform: translateX(-100%); }
      100% { transform: translateX(250%); }
    }
  </style>
</head>
<body>
  <div class="splash-container">
    <div class="art-bg"></div>
    <div class="info-box">
      <h1>Propositum Formarum</h1>
      <div class="loader">
        <div class="loader-bar"></div>
      </div>
    </div>
  </div>
</body>
</html>
